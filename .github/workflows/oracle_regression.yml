name: oracle_regression

on:
  push:
    branches: [ master , IVORY_REL_4_STABLE , IVORYSQL_REL_1_STABLE]
  pull_request:
    branches: [ master , IVORY_REL_4_STABLE , IVORYSQL_REL_1_STABLE]

permissions:
  contents: read

jobs:
  oracle_regression:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]

    env:
      LLVM_CONFIG: /usr/bin/llvm-config
      CLANG: /usr/bin/clang
      # Exercise the OAuth mock-server tests enabled by libcurl.
      PG_TEST_EXTRA: oauth

    steps:
    - uses: actions/checkout@v4
    - name: dependancy
      if: ${{ matrix.os == 'ubuntu-latest' }}
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git lcov bison flex \
              libkrb5-dev libssl-dev libldap-dev libpam-dev python3-dev \
              tcl-dev libperl-dev gettext libxml2-dev libxslt-dev \
              libreadline-dev libedit-dev uuid-dev libossp-uuid-dev \
              libipc-run-perl libtime-hires-perl libtest-simple-perl \
              libicu-dev libnuma-dev \
              pkg-config llvm-dev clang liblz4-dev libzstd-dev lz4 zstd \
              libsystemd-dev libselinux1-dev tzdata systemtap-sdt-dev \
              libcurl4-openssl-dev liburing-dev
    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2.23
      with:
        key: ${{ runner.os }}-autoconf
        restore-keys: |
          ${{ runner.os }}-autoconf
        max-size: 2G
        save: ${{ github.event_name == 'push' }}
    - name: Configure ccache
      run: echo "CCACHE_SLOPPINESS=time_macros" >> "$GITHUB_ENV"
    - name: configure - linux
      if: ${{ matrix.os == 'ubuntu-latest' }}
      env:
        CC: ccache gcc
        CXX: ccache g++
      run: |
        ./configure \
            --prefix=$PWD/inst \
            --enable-cassert --enable-debug --enable-tap-tests --enable-rpath \
            --with-tcl --with-python --with-gssapi --with-pam --with-ldap \
            --with-openssl --with-libedit-preferred --with-uuid=e2fs \
            --with-ossp-uuid  --with-libxml --with-libxslt  --with-perl \
            --with-icu --with-libnuma --enable-injection-points --enable-nls \
            --with-llvm --with-lz4 --with-zstd --with-systemd --with-selinux \
            --with-system-tzdata=/usr/share/zoneinfo \
            --enable-dtrace --with-libcurl --with-liburing \
            --with-extra-version="-ci"
    - name: compile
      run: make -j"$(nproc)" && make install

    - name: report build configuration
      run: |
        ./src/bin/pg_config/pg_config --version
        ./src/bin/pg_config/pg_config --configure

    - name: oracle_regression
      run: make oracle-check-world

    - name: collect files
      if: failure()
      run: |
          find . \( -name "*.diffs" -or -name "oracle_regression.out" -or -path \*/tmp_check/log -or -path \*src/test/regress/log \) -print0 |
                xargs -0 tar -czf oracle_regression.tar.gz
    - name: upload oracle_regression files
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: results
        path: ${{ github.workspace }}/oracle_regression.tar.gz

  compression_without_lz4:
    name: compression without LZ4
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4
    - name: install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential bison flex pkg-config \
            libicu-dev libreadline-dev zlib1g-dev uuid-dev
    - name: configure without LZ4
      run: |
        ./configure \
            --prefix="$PWD/inst" \
            --enable-cassert --enable-debug --with-uuid=e2fs --without-lz4 \
            --with-extra-version="-ci"
    - name: compile
      run: make -j2
    - name: report build configuration
      run: |
        ./src/bin/pg_config/pg_config --version
        ./src/bin/pg_config/pg_config --configure
    - name: compression regression without LZ4
      # compression uses the fipshash helpers created by test_setup.
      run: make oracle-check-tests TESTS='test_setup compression compression_lz4 ora_jit'
    - name: upload compression failure files
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: compression-without-lz4-results
        path: |
          config.log
          src/oracle_test/regress/regression.diffs
          src/oracle_test/regress/regression.out
          src/oracle_test/regress/log/
          src/oracle_test/regress/tmp_check/log/
          tmp_install/log/
