name: build

on:
  push:
    branches: [ master , IVORY_REL_4_STABLE , IVORYSQL_REL_1_STABLE]
  pull_request:
    branches: [ master , IVORY_REL_4_STABLE , IVORYSQL_REL_1_STABLE]

concurrency:
  # Cancel superseded runs of the same pull request (grouped by PR number)
  # and of non-protected branches (grouped by ref). Preserve every push run
  # on protected branches (master/IVORY_REL_4_STABLE/IVORYSQL_REL_1_STABLE)
  # by giving each run a unique group (run_id), so that every pushed commit
  # is tested.
  group: |
    ${{github.workflow }}-${{
    case(github.event_name == 'pull_request',
         format('pr-{0}', github.event.pull_request.number),
         case(github.ref == 'refs/heads/master' ||
              github.ref == 'refs/heads/IVORY_REL_4_STABLE' ||
              github.ref == 'refs/heads/IVORYSQL_REL_1_STABLE',
              github.run_id,
              github.ref))
    }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      matrix:
        os: [ubuntu-latest]

    steps:
    - uses: actions/checkout@v3
    - name: dependancy - linux
      if: ${{ matrix.os == 'ubuntu-latest' }}
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-14 g++-14
        sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100
        sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 100
        sudo apt-get install -y build-essential git lcov bison flex \
              libkrb5-dev libssl-dev libldap-dev libpam-dev python3-dev \
              tcl-dev libperl-dev gettext libxml2-dev libxslt-dev \
              libreadline-dev libedit-dev uuid-dev libossp-uuid-dev \
              libipc-run-perl libtime-hires-perl libtest-simple-perl \
              libgssapi-krb5-2 libicu-dev libnuma-dev
    - name: configure - linux
      if: ${{ matrix.os == 'ubuntu-latest' }}
      run: |
        ./configure \
            --enable-cassert --enable-debug --enable-rpath --with-tcl \
            --with-python --with-gssapi --with-pam --with-ldap \
            --with-openssl --with-libedit-preferred --with-uuid=e2fs \
            --with-ossp-uuid  --with-libxml --with-libxslt  --with-perl \
            --with-icu --with-libnuma --enable-injection-points --enable-nls
    - name: compile
      run: make COPT="-Wshadow=compatible-local -Wall -Werror -Wno-stringop-truncation"

  build-clang:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v3
    - name: dependency - linux
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-18
        sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 100
        sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-18 100
        sudo apt-get install -y build-essential git lcov bison flex \
              libkrb5-dev libssl-dev libldap-dev libpam-dev python3-dev \
              tcl-dev libperl-dev gettext libxml2-dev libxslt-dev \
              libreadline-dev libedit-dev uuid-dev libossp-uuid-dev \
              libipc-run-perl libtime-hires-perl libtest-simple-perl \
              libgssapi-krb5-2 libicu-dev libnuma-dev
    - name: configure - linux
      run: |
        CC=clang CXX=clang++ ./configure \
            --enable-cassert --enable-debug --enable-rpath --with-tcl \
            --with-python --with-gssapi --with-pam --with-ldap \
            --with-openssl --with-libedit-preferred --with-uuid=e2fs \
            --with-ossp-uuid  --with-libxml --with-libxslt  --with-perl \
            --with-icu --with-libnuma --enable-injection-points --enable-nls
    - name: compile
      run: make COPT="-Werror"
